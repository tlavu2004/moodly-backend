name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify application and OpenAPI contract
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode verify

      - name: Summarize coverage
        if: success()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_path = Path("target/site/jacoco/jacoco.xml")
          root = ET.parse(report_path).getroot()
          counters = {counter.attrib["type"]: counter.attrib for counter in root.findall("counter")}

          rows = []
          for metric in ("INSTRUCTION", "BRANCH", "LINE", "METHOD", "CLASS"):
              counter = counters[metric]
              missed = int(counter["missed"])
              covered = int(counter["covered"])
              total = missed + covered
              percentage = covered / total * 100 if total else 100
              rows.append((metric.title(), covered, total, percentage))

          summary = [
              "## JaCoCo coverage",
              "",
              "| Metric | Covered | Total | Coverage |",
              "| --- | ---: | ---: | ---: |",
          ]
          summary.extend(
              f"| {metric} | {covered} | {total} | {percentage:.1f}% |"
              for metric, covered, total, percentage in rows
          )
          summary.extend(("", "Coverage is reported only; no quality gate is enforced yet."))
          output = "\n".join(summary) + "\n"

          print(output)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary_file:
              summary_file.write(output)
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate and validate OpenAPI document
        run: |
          chmod +x src/main/resources/scripts/openapi/generate-openapi.sh
          src/main/resources/scripts/openapi/generate-openapi.sh
          python3 - <<'PY'
          import json
          from pathlib import Path

          document_path = Path("docs/api/moodly-openapi.json")
          document = json.loads(document_path.read_text(encoding="utf-8-sig"))
          assert document["openapi"].startswith("3."), "Expected an OpenAPI 3 document"
          assert document.get("paths"), "OpenAPI document must define at least one path"
          print(f"Validated {document_path}: {len(document['paths'])} paths")
          PY

      - name: Ensure the committed OpenAPI document is current
        run: git diff --exit-code -- docs/api/moodly-openapi.json

  build-image:
    name: Build container image
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moodly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-image:
    name: Publish container image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
