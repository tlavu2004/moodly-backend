name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A reviewed digest-only promotion must not rebuild a second application image.
    paths-ignore: ["render.yaml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/verify.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish-image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the release image
        env:
          SMOKE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash scripts/docker/run-tooling.sh automation container-smoke "$SMOKE_IMAGE"

      - name: Push the tested image and record its digest
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: bash scripts/docker/run-tooling.sh automation publish-release

      - name: Render the reviewed deployment candidate
        env:
          RELEASE_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository }}
        run: bash scripts/docker/run-tooling.sh automation render-candidate release-image.json render.yaml render-release.yaml "${RELEASE_REPOSITORY,,}"

      - name: Upload release image record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ github.sha }}
          path: |
            release-image.json
            render-release.yaml
          retention-days: 90
