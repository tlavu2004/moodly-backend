name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/verify.yml

  publish-image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and load image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the release image
        env:
          SMOKE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: python3 scripts/docker/smoke-test.py "$SMOKE_IMAGE"

      - name: Push the tested image and record its digest
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tags = json.loads(os.environ["IMAGE_METADATA"])["tags"]
          for tag in tags:
              subprocess.run(["docker", "push", tag], check=True)
          image = json.loads(subprocess.check_output(["docker", "image", "inspect", tags[0]], text=True))[0]
          digests = image["RepoDigests"]
          if not digests:
              raise RuntimeError("Published image has no repository digest")
          record = {"commit": os.environ["GITHUB_SHA"], "tags": tags, "images": digests}
          Path("release-image.json").write_text(json.dumps(record, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Verified release image\n\n")
              summary.write(f"Commit: `{record['commit']}`\n\n")
              summary.write("\n".join(f"- `{digest}`" for digest in digests) + "\n")
          PY

      - name: Upload release image record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-image-${{ github.sha }}
          path: release-image.json
          retention-days: 90
