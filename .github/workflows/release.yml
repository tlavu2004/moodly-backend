name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A reviewed digest-only promotion must not rebuild a second application image.
    paths-ignore: ["render.yaml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Release verification
    uses: ./.github/workflows/verify.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish-image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the release image
        env:
          SMOKE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: python3 scripts/docker/smoke-test.py "$SMOKE_IMAGE"

      - name: Push the tested image and record its digest
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tags = json.loads(os.environ["IMAGE_METADATA"])["tags"]
          repository = f"{os.environ['REGISTRY']}/{os.environ['IMAGE_NAME'].lower()}"
          if not tags or any(not re.fullmatch(re.escape(repository) + r":[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag) for tag in tags):
              raise RuntimeError("Release tags must belong to the expected repository")
          image = json.loads(subprocess.check_output(["docker", "image", "inspect", tags[0]], text=True))[0]
          if image.get("Config", {}).get("Labels", {}).get("org.opencontainers.image.revision") != os.environ["GITHUB_SHA"]:
              raise RuntimeError("Loaded image revision does not match the verified commit")
          if image.get("Os") != "linux" or image.get("Architecture") != "amd64":
              raise RuntimeError("Render release image must target linux/amd64")
          for tag in tags:
              subprocess.run(["docker", "push", tag], check=True)
          published = json.loads(subprocess.check_output(["docker", "image", "inspect", tags[0]], text=True))[0]
          if published["Id"] != image["Id"]:
              raise RuntimeError("Image identity changed during publication")
          digests = [value for value in published["RepoDigests"] if re.fullmatch(re.escape(repository) + r"@sha256:[0-9a-f]{64}", value)]
          if len(digests) != 1:
              raise RuntimeError("Expected exactly one published digest for the release repository")
          record = {"schemaVersion": 1, "commit": os.environ["GITHUB_SHA"], "repository": repository, "tags": tags, "images": digests}
          Path("release-image.json").write_text(json.dumps(record, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## Verified release image\n\n")
              summary.write(f"Commit: `{record['commit']}`\n\n")
              summary.write("\n".join(f"- `{digest}`" for digest in digests) + "\n")
          PY

      - name: Render the reviewed deployment candidate
        env:
          RELEASE_REPOSITORY: ${{ env.REGISTRY }}/${{ github.repository }}
        run: python3 scripts/deployment/render_blueprint.py release-image.json render.yaml render-release.yaml --repository "${RELEASE_REPOSITORY,,}"

      - name: Upload release image record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-image-${{ github.sha }}
          path: |
            release-image.json
            render-release.yaml
          retention-days: 90
