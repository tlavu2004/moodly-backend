services:
  mongodb:
    image: mongo:${MONGODB_VERSION:?Set MONGODB_VERSION}
    container_name: moodly-mongodb-local
    restart: unless-stopped
    labels:
      io.moodly.local-database: ${MONGODB_DATABASE:-moodly_local}
    ports:
      - "127.0.0.1:${MONGODB_PORT}:${MONGODB_CONTAINER_PORT}"
    environment:
      GLIBC_TUNABLES: ${MONGODB_GLIBC_TUNABLES:?Set MONGODB_GLIBC_TUNABLES}
      MONGODB_CONTAINER_PORT: ${MONGODB_CONTAINER_PORT}
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET}
      MONGODB_REPLICA_ADVERTISED_HOST: ${MONGODB_REPLICA_ADVERTISED_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
    command: ["mongod", "--replSet", "${MONGODB_REPLICA_SET}", "--bind_ip_all", "--port", "${MONGODB_CONTAINER_PORT}"]
    volumes:
      - moodly-mongodb-local-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host ${MONGODB_CONTAINER_HOST}:${MONGODB_CONTAINER_PORT} --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    container_name: moodly-elasticsearch-local
    labels:
      io.moodly.local-index: ${MOODLY_SEARCH_INDEX_NAME:-daily_entries_search}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - action.auto_create_index=false
      - ES_JAVA_OPTS=-Xms${ELASTICSEARCH_HEAP_SIZE} -Xmx${ELASTICSEARCH_HEAP_SIZE}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT}:${ELASTICSEARCH_CONTAINER_PORT}"
    volumes:
      - moodly-elasticsearch-local-data-oss7:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${ELASTICSEARCH_CONTAINER_HOST}:${ELASTICSEARCH_CONTAINER_PORT}/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  moodly-mongodb-local-data:
  moodly-elasticsearch-local-data-oss7:
