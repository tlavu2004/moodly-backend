name: moodly-backend-local

services:
  mongodb:
    image: mongo:${MONGODB_VERSION:?Set MONGODB_VERSION}
    container_name: moodly-mongodb-local
    restart: unless-stopped
    labels:
      io.moodly.local-database: ${MONGODB_DATABASE:-moodly_local}
    ports:
      - "127.0.0.1:${MONGODB_PORT}:${MONGODB_CONTAINER_PORT}"
    environment:
      GLIBC_TUNABLES: ${MONGODB_GLIBC_TUNABLES:?Set MONGODB_GLIBC_TUNABLES}
      MONGODB_CONTAINER_PORT: ${MONGODB_CONTAINER_PORT}
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET}
      MONGODB_REPLICA_ADVERTISED_HOST: ${MONGODB_REPLICA_ADVERTISED_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
    command: ["mongod", "--replSet", "${MONGODB_REPLICA_SET}", "--bind_ip_all", "--port", "${MONGODB_CONTAINER_PORT}"]
    volumes:
      - moodly-mongodb-local-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "HOME=/tmp XDG_CONFIG_HOME=/tmp/moodly-mongosh mongosh --quiet --host ${MONGODB_CONTAINER_HOST}:${MONGODB_CONTAINER_PORT} --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'"]
      interval: 5s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    container_name: moodly-elasticsearch-local
    labels:
      io.moodly.local-index: ${MOODLY_SEARCH_INDEX_NAME:-daily_entries_search}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - action.auto_create_index=false
      - ES_JAVA_OPTS=-Xms${ELASTICSEARCH_HEAP_SIZE} -Xmx${ELASTICSEARCH_HEAP_SIZE}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT}:${ELASTICSEARCH_CONTAINER_PORT}"
    volumes:
      - moodly-elasticsearch-local-data-oss7:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${ELASTICSEARCH_CONTAINER_HOST}:${ELASTICSEARCH_CONTAINER_PORT}/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  backend:
    profiles: [backend]
    image: moodly-backend:local
    build:
      context: .
    container_name: moodly-backend-local-app
    init: true
    restart: "no"
    stop_grace_period: 30s
    labels:
      io.moodly.backend.mode: ${MOODLY_CONTAINER_MODE:-local}
    env_file:
      - ${MOODLY_INFRA_ENV_FILE:-.env.local.example}
    environment:
      SPRING_PROFILES_ACTIVE: ${MOODLY_CONTAINER_PROFILE:-local}
      SERVER_PORT: "8080"
      MONGODB_DATABASE: ${MOODLY_CONTAINER_DATABASE:-${MONGODB_DATABASE}}
      MOODLY_SEARCH_INDEX_NAME: ${MOODLY_CONTAINER_INDEX:-${MOODLY_SEARCH_INDEX_NAME}}
      SPRING_MONGODB_URI: mongodb://mongodb:${MONGODB_CONTAINER_PORT}/${MOODLY_CONTAINER_DATABASE:-${MONGODB_DATABASE}}?replicaSet=${MONGODB_REPLICA_SET}&directConnection=true
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:${ELASTICSEARCH_CONTAINER_PORT}
    ports:
      - "127.0.0.1:${SERVER_PORT}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

# Keep existing physical volume identities when changing the Compose project.
volumes:
  moodly-mongodb-local-data:
    name: moodly-local_moodly-mongodb-local-data
  moodly-elasticsearch-local-data-oss7:
    name: moodly-local_moodly-elasticsearch-local-data-oss7
