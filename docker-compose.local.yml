services:
  mongodb:
    image: mongo:${MONGODB_VERSION}
    container_name: moodly-mongodb-local
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT}:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - moodly-mongodb-local-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb-init:
    image: mongo:${MONGODB_VERSION}
    container_name: moodly-mongodb-local-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        state="$$(mongosh --quiet --host mongodb:27017 --eval 'try { rs.status(); print("INITIALIZED"); } catch (error) { print(error.codeName); }')"
        case "$$state" in
          *INITIALIZED*) echo "Replica set rs0 is already initialised." ;;
          *NotYetInitialized*)
            mongosh --host mongodb:27017 --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
            ;;
          *) echo "Unable to determine replica-set state: $$state"; exit 1 ;;
        esac

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: moodly-elasticsearch-local
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - moodly-elasticsearch-local-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  moodly-mongodb-local-data:
  moodly-elasticsearch-local-data:
