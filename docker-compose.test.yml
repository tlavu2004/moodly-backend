services:
  mongodb:
    image: mongo:${MONGODB_VERSION}
    container_name: moodly-mongodb-test
    ports:
      - "${MONGODB_PORT}:${MONGODB_CONTAINER_PORT}"
    command: ["mongod", "--replSet", "${MONGODB_REPLICA_SET}", "--bind_ip_all", "--port", "${MONGODB_CONTAINER_PORT}"]
    volumes:
      - moodly-mongodb-test-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host ${MONGODB_CONTAINER_HOST}:${MONGODB_CONTAINER_PORT} --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb-init:
    image: mongo:${MONGODB_VERSION}
    container_name: moodly-mongodb-test-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        state="$$(mongosh --quiet --host ${MONGODB_SERVICE_HOST}:${MONGODB_CONTAINER_PORT} --eval 'try { rs.status(); print("INITIALIZED"); } catch (error) { print(error.codeName); }')"
        case "$$state" in
          *INITIALIZED*) echo "Replica set ${MONGODB_REPLICA_SET} is already initialised." ;;
          *NotYetInitialized*)
            mongosh --host ${MONGODB_SERVICE_HOST}:${MONGODB_CONTAINER_PORT} --eval 'rs.initiate({ _id: "${MONGODB_REPLICA_SET}", members: [{ _id: 0, host: "${MONGODB_REPLICA_ADVERTISED_HOST}:${MONGODB_PORT}" }] })'
            ;;
          *) echo "Unable to determine replica-set state: $$state"; exit 1 ;;
        esac

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: moodly-elasticsearch-test
    ports:
      - "${ELASTICSEARCH_PORT}:${ELASTICSEARCH_CONTAINER_PORT}"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms${ELASTICSEARCH_HEAP_SIZE} -Xmx${ELASTICSEARCH_HEAP_SIZE}
    volumes:
      - moodly-elasticsearch-test-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${ELASTICSEARCH_CONTAINER_HOST}:${ELASTICSEARCH_CONTAINER_PORT}/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  moodly-mongodb-test-data:
  moodly-elasticsearch-test-data:
