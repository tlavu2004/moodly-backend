server:
  port: ${SERVER_PORT}

spring:
  config:
    import: "file:.env.docs.example[.properties],optional:file:.env.docs[.properties]"
  mongodb:
    uri: ${DOCS_MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false
  elasticsearch:
    uris: ${DOCS_ELASTICSEARCH_URIS}
  task:
    scheduling:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${DOCS_JWK_SET_URI}

moodly:
  entries:
    collection-name: ${DOCS_ENTRIES_COLLECTION_NAME}
  cdc:
    enabled: false
    stream-id: ${DOCS_CDC_STREAM_ID}
    maintenance-key: ${DOCS_CDC_MAINTENANCE_KEY}
    retry:
      max-attempts: ${DOCS_CDC_RETRY_MAX_ATTEMPTS}
      initial-backoff-ms: ${DOCS_CDC_RETRY_INITIAL_BACKOFF_MS}
    reindex:
      batch-size: ${DOCS_CDC_REINDEX_BATCH_SIZE}
  search:
    index:
      name: ${DOCS_SEARCH_INDEX_NAME}
      mapping-resource: ${DOCS_SEARCH_MAPPING_RESOURCE}
      initialization-enabled: false
  cloudinary:
    cloud-name: ${DOCS_CLOUDINARY_CLOUD_NAME}
    api-key: ${DOCS_CLOUDINARY_API_KEY}
    api-secret: ${DOCS_CLOUDINARY_API_SECRET}
    upload-preset: ${DOCS_CLOUDINARY_UPLOAD_PRESET}
    folder: ${DOCS_CLOUDINARY_FOLDER}
    pending-cleanup:
      enabled: false
