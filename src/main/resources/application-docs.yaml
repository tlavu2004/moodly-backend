server:
  port: 8081

spring:
  data:
    mongodb:
      auto-index-creation: false
  elasticsearch:
    uris: http://127.0.0.1:9200
  task:
    scheduling:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:65535/docs-jwks

moodly:
  entries:
    collection-name: daily_entries
  cdc:
    enabled: false
    stream-id: daily_entries
    maintenance-key: docs-maintenance-key
    retry:
      max-attempts: 3
      initial-backoff-ms: 200
    reindex:
      batch-size: 250
  search:
    index:
      name: daily_entries_search
      mapping-resource: classpath:elasticsearch/daily_entries_search.json
      initialization-enabled: false
  cloudinary:
    cloud-name: docs-cloud
    api-key: docs-api-key
    api-secret: docs-api-secret
    upload-preset: docs-upload-preset
    folder: moodly/docs
    pending-cleanup:
      enabled: false
