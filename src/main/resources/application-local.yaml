spring:
  mongodb:
    uri: mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?replicaSet=${MONGODB_REPLICA_SET}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}

moodly:
  e2e:
    reset:
      enabled: ${MOODLY_E2E_RESET_ENABLED:false}
      token: ${MOODLY_E2E_RESET_TOKEN:}
      user-id: ${MOODLY_E2E_USER_ID:synthetic|moodly-playwright-e2e}
  auth0:
    audience: ${AUTH0_AUDIENCE}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET}
    folder: ${CLOUDINARY_FOLDER}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      show-components: always
      show-details: always
