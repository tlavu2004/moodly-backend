spring:
  application:
    name: moodly
  profiles:
    default: local
  data:
    mongodb:
      auto-index-creation: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

moodly:

  cdc:
    enabled: true
    maintenance-key: ${MOODLY_CDC_MAINTENANCE_KEY:}
    retry:
      max-attempts: 3
      initial-backoff-ms: 200

  search:
    index:
      initialization-enabled: true

management:
  endpoint:
    health:
      show-components: always
      show-details: always
