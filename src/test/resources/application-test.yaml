spring:
  config:
    import: "file:.env.test.example[.properties]"

moodly:
  rate-limit:
    enabled: ${TEST_RATE_LIMIT_ENABLED}
  e2e:
    reset:
      enabled: ${TEST_E2E_RESET_ENABLED}
      token: ${TEST_E2E_RESET_TOKEN}
      user-id: ${TEST_E2E_USER_ID}
  cloudinary:
    cloud-name: ${TEST_CLOUDINARY_CLOUD_NAME}
    api-key: ${TEST_CLOUDINARY_API_KEY}
    api-secret: ${TEST_CLOUDINARY_API_SECRET}
    upload-preset: ${TEST_CLOUDINARY_UPLOAD_PRESET}
    folder: ${TEST_CLOUDINARY_FOLDER}
  entries:
    collection-name: ${TEST_ENTRIES_COLLECTION_NAME}
  cdc:
    enabled: ${TEST_CDC_ENABLED}
    maintenance-key: ${TEST_CDC_MAINTENANCE_KEY}
    stream-id: ${TEST_CDC_STREAM_ID}
    retry:
      max-attempts: ${TEST_CDC_RETRY_MAX_ATTEMPTS}
      initial-backoff-ms: ${TEST_CDC_RETRY_INITIAL_BACKOFF_MS}
    reindex:
      batch-size: ${TEST_CDC_REINDEX_BATCH_SIZE}
  search:
    index:
      name: ${MOODLY_SEARCH_INDEX_NAME}
      mapping-resource: ${TEST_SEARCH_MAPPING_RESOURCE}
      initialization-enabled: ${TEST_SEARCH_INITIALIZATION_ENABLED}
