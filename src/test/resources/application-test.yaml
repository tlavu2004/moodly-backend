spring:
  mongodb:
    uri: mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?replicaSet=${MONGODB_REPLICA_SET}
  elasticsearch:
    uris: http://localhost:9200

moodly:
  cloudinary:
    cloud-name: test-cloud
    api-key: test-api-key
    api-secret: test-api-secret
    upload-preset: test-upload-preset
    folder: moodly/test
  testcontainers:
    mongodb-image: mongo:${MONGODB_VERSION:8.3.7}
    elasticsearch-image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:9.5.0}
  entries:
    collection-name: daily_entries
  cdc:
    enabled: false
    maintenance-key: test-maintenance-key
    stream-id: daily_entries
    retry:
      max-attempts: 3
      initial-backoff-ms: 200
    reindex:
      batch-size: 250
  search:
    index:
      name: daily_entries_search
      mapping-resource: classpath:elasticsearch/daily_entries_search.json
      initialization-enabled: false
